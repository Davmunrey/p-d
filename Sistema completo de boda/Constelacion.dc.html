<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ cajaStyle }}">
  <svg viewBox="0 0 100 100" width="100%" height="100%" fill="none" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible">
    <sc-for list="{{ lineas }}" as="l" hint-placeholder-count="5">
      <line x1="{{ l.x1 }}" y1="{{ l.y1 }}" x2="{{ l.x2 }}" y2="{{ l.y2 }}" stroke="{{ trazo }}" stroke-width="{{ grosor }}" stroke-linecap="round"></line>
    </sc-for>
    <sc-for list="{{ estrellas }}" as="e" hint-placeholder-count="6">
      <circle cx="{{ e.x }}" cy="{{ e.y }}" r="{{ e.r }}" fill="{{ color }}"></circle>
    </sc-for>
  </svg>
</div>
</x-dc>

class Component extends DCLogic {
  renderVals() {
    const clave = String(this.props.constelacion || 'lira').toLowerCase().replace(/[^a-z]/g, '');
    const d = MAPA[clave] || MAPA.lira;
    const color = this.props.color || '#3C4233';
    const trazo = this.props.colorTrazo || 'rgba(107,112,96,.42)';
    const escala = Number(this.props.escalaEstrella || 1);
    return {
      color, trazo,
      grosor: Number(this.props.grosorTrazo || 0.7),
      estrellas: d.estrellas.map(([x, y, r]) => ({ x, y, r: r * escala })),
      lineas: d.lineas.map(([a, b]) => ({
        x1: d.estrellas[a][0], y1: d.estrellas[a][1],
        x2: d.estrellas[b][0], y2: d.estrellas[b][1]
      })),
      cajaStyle: 'width:100%;height:100%;display:block'
    };
  }
}
</script>
</body>
</html>
