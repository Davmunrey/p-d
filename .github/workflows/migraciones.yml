name: Migraciones

# Aplica a producción las migraciones que entren en `main`.
#
# POR QUÉ SE PUEDE HACER AUTOMÁTICO SIN MIEDO
#
# No es que se confíe en que la migración esté bien: es que ya se ha
# comprobado. Antes de que nada llegue aquí, el trabajo «Migraciones y
# seguridad de la BBDD» ha aplicado TODAS las migraciones desde cero contra un
# PostgreSQL limpio y ha pasado 36 comprobaciones de seguridad —que `anon` no
# lee ninguna tabla privada, que nadie se cuela registrándose, que un invitado
# no puede confirmar por otro—. Una migración rota no llega a `main`.
#
# LO QUE ESTE FLUJO NO HACE
#
# No carga el seed. Ese fichero tiene datos de desarrollo con el prefijo
# «(DES)» y no puede acercarse a la boda de verdad. `supabase db push` solo
# aplica migraciones.
#
# Tampoco deshace nada. Las migraciones son hacia delante; cada una trae su SQL
# de rollback en `supabase/migrations/rollback/` para aplicarlo a mano si hace
# falta, con la cabeza fría y mirando lo que se borra.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migraciones.yml"
  # Para poder relanzarlo si falló por una caída pasajera.
  workflow_dispatch:

# Dos despliegues a la vez sobre la misma base es la forma de dejarla a medias.
concurrency:
  group: migraciones-produccion
  cancel-in-progress: false

jobs:
  aplicar:
    name: Aplicar en producción
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que hay credenciales
        id: credenciales
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CLAVE: ${{ secrets.SUPABASE_DB_PASSWORD }}
          # De la variable, o del secreto si alguien lo guardó ahí. El sitio
          # bueno es Variables —no es un secreto, sale en la URL del dashboard,
          # y como secreto los registros lo tapan justo cuando hace falta
          # leerlo—, pero equivocarse de pestaña es facilísimo y el síntoma era
          # un tic verde sin haber aplicado nada. Se acepta de los dos sitios y
          # se avisa; que funcione no depende de acertar a la primera.
          PROYECTO: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          EN_VARIABLES: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        # SALTARSE ESTO EN SILENCIO SÓLO VALE CUANDO NADIE LO HA PEDIDO.
        #
        # Si el flujo salta solo al mergear a `main` y aún no hay credenciales,
        # avisar y seguir es lo correcto: no tiene sentido teñir de rojo un
        # despliegue por una configuración que todavía no está.
        #
        # Pero si alguien le ha dado al botón, ha pedido que se apliquen las
        # migraciones. Devolverle un tic verde habiendo hecho nada es mentirle
        # —pasó, y el aviso se perdió entre cien líneas de registro—, así que
        # ahí se falla y se dice exactamente qué falta.
        run: |
          faltan=""
          [ -z "$TOKEN" ]    && faltan="$faltan SUPABASE_ACCESS_TOKEN(secreto)"
          [ -z "$CLAVE" ]    && faltan="$faltan SUPABASE_DB_PASSWORD(secreto)"
          [ -z "$PROYECTO" ] && faltan="$faltan SUPABASE_PROJECT_REF(pestaña_Variables)"

          if [ -z "$faltan" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
            echo "proyecto=$PROYECTO" >> "$GITHUB_OUTPUT"
            if [ "$EN_VARIABLES" != "true" ]; then
              echo "::warning::SUPABASE_PROJECT_REF está en Secrets. Funciona, pero su sitio es la pestaña Variables: como secreto, los registros lo tapan con asteriscos justo cuando hace falta leerlo para depurar."
            fi
            exit 0
          fi

          echo "hay=no" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::Se ha pedido aplicar las migraciones, pero falta:$faltan. Ver docs/ENTORNO.md. No se ha aplicado nada."
            exit 1
          fi

          echo "::warning::Falta:$faltan. Ver docs/ENTORNO.md. Las migraciones no se aplican."

      - uses: supabase/setup-cli@v1
        if: steps.credenciales.outputs.hay == 'si'
        with:
          version: latest

      # ENLAZAR PUEDE FALLAR SIN QUE SE CAIGA EL MUNDO, y aquí está el porqué.
      #
      # `SUPABASE_ACCESS_TOKEN` es un token personal y caduca. Cuando caducó,
      # este paso empezó a responder «Unauthorized» y el trabajo moría antes de
      # tocar la base: dos merges salieron a producción con el esquema viejo
      # detrás y la web se quedó en la pantalla de respaldo, porque el código
      # pedía una columna que todavía no existía.
      #
      # Que un token personal sea lo único que separa a producción de quedarse
      # atrás es el fallo. Por eso ahora, si el CLI no puede entrar, se aplica
      # por el camino de repuesto, que usa `DATABASE_URL` —la misma cadena que
      # ya emplea `mantener-viva.yml`— y no depende de ningún token.
      - name: Enlazar con el proyecto
        id: enlace
        if: steps.credenciales.outputs.hay == 'si'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ steps.credenciales.outputs.proyecto }}"

      - name: Ver qué se va a aplicar
        if: steps.credenciales.outputs.hay == 'si' && steps.enlace.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Queda en el registro qué migraciones estaban pendientes. Cuando algo
        # sale mal, la primera pregunta siempre es «¿qué se aplicó?».
        run: supabase migration list --linked

      - name: Aplicar
        if: steps.credenciales.outputs.hay == 'si' && steps.enlace.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --include-all

      - name: Comprobar que quedó al día
        if: steps.credenciales.outputs.hay == 'si' && steps.enlace.outcome == 'success'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        # Si algo quedó sin aplicar, mejor enterarse aquí que dentro de un mes.
        run: supabase migration list --linked

      # ── CAMINO DE REPUESTO ────────────────────────────────────────────────
      #
      # Habla directamente con Postgres. Lee de la tabla de control qué
      # versiones están aplicadas y ejecuta en orden las que falten; cada
      # migración trae su propio `begin`/`commit`, así que o entra entera o no
      # entra. Se planta si hay más pendientes de las razonables, que es lo que
      # pasaría si la tabla de control no se pudiera leer y el script creyera
      # que la base está vacía.
      - name: Aplicar sin el CLI, porque el enlace falló
        if: steps.credenciales.outputs.hay == 'si' && steps.enlace.outcome == 'failure'
        env:
          # Los tres, por orden de preferencia: la cadena entera si existe, y si
          # no los dos secretos con los que el script la arma. En este
          # repositorio no había `DATABASE_URL` y el camino de repuesto se quedó
          # sin camino; los otros dos sí estaban, porque el CLI ya los pide.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$DATABASE_URL" ] && { [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; }; then
            echo "::error::'supabase link' falló (¿token caducado?) y no hay ni DATABASE_URL ni con qué armarla. No se ha aplicado nada. Ver docs/ENTORNO.md."
            exit 1
          fi
          echo "::warning::'supabase link' falló: es casi seguro que SUPABASE_ACCESS_TOKEN ha caducado. Se aplican las migraciones por Postgres. Renueva el token en Supabase → Account → Access Tokens."
          # El runner de Ubuntu trae el cliente de Postgres, pero este camino
          # sólo se usa cuando algo ya ha ido mal: no es el momento de
          # descubrir que falta una herramienta.
          command -v psql >/dev/null || {
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          }

          ./scripts/aplicar-migraciones.sh
