name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: ESLint (incluye reglas anti-hardcode)
        run: npm run lint

      - name: Stylelint (colores literales fuera de primitivos)
        run: npm run lint:css

      - name: Formato
        run: npm run format:check

  base-de-datos:
    name: Migraciones y seguridad de la BBDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib

      - name: Aplicar migraciones y ejecutar la suite de seguridad
        # Bloqueante a propósito: comprueba que anon no puede leer ninguna tabla
        # privada, que nadie se cuela registrándose, y que un invitado no puede
        # confirmar por otro. Si esto falla, no se mergea.
        run: sudo ./scripts/probar-bbdd.sh

  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit

      - name: Ejecutar suite E2E
        run: npm run test:e2e

      - name: Guardar informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7
