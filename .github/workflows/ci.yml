name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: ESLint (incluye reglas anti-hardcode)
        run: npm run lint

      - name: Stylelint (colores literales fuera de primitivos)
        run: npm run lint:css

      - name: Formato
        run: npm run format:check

  base-de-datos:
    name: Migraciones y seguridad de la BBDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib

      - name: Aplicar migraciones y ejecutar la suite de seguridad
        # Bloqueante a propósito: comprueba que anon no puede leer ninguna tabla
        # privada, que nadie se cuela registrándose, y que un invitado no puede
        # confirmar por otro. Si esto falla, no se mergea.
        run: sudo ./scripts/probar-bbdd.sh

  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit

      - name: Preparar base de datos con migraciones y seed
        # Los E2E corren contra una base REAL, no contra mocks: la landing lee
        # de la base de datos, así que probarla con datos falsos no probaría
        # nada de lo que importa.
        run: echo "DATABASE_URL=$(sudo ./scripts/preparar-bbdd.sh)" >> "$GITHUB_ENV"

      - name: Ejecutar suite E2E
        run: npm run test:e2e

      - name: Guardar informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7

  acceso:
    name: Acceso al panel (Supabase real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta Postgres, GoTrue y el buzón de correo. Es lento —descarga
      # imágenes— y por eso va en su propio trabajo: el resto del CI no espera.
      - name: Levantar Supabase
        run: supabase start

      - name: Aplicar migraciones y seed
        run: supabase db reset

      - name: Crear los usuarios de prueba
        run: psql "$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '\"')" -v ON_ERROR_STOP=1 -f scripts/preparar-acceso-pruebas.sql

      - name: Recoger las claves del Supabase local
        run: supabase status -o env | sed 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/; s/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/; s/^DB_URL=/DATABASE_URL=/' | tr -d '"' >> "$GITHUB_ENV"

      - name: Probar el recorrido completo del acceso
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          URL_BUZON: http://127.0.0.1:54324
          CORREO_CON_ACCESO: con-acceso@ejemplo.test
          CORREO_SIN_ACCESO: sin-acceso@ejemplo.test
        run: npx playwright test --project=escritorio tests/e2e/acceso-real.spec.ts

      - name: Guardar informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-acceso
          path: playwright-report/
          retention-days: 7
