name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Calidad de código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Comprobación de tipos
        run: npm run typecheck

      - name: ESLint (incluye reglas anti-hardcode)
        run: npm run lint

      - name: Stylelint (colores literales fuera de primitivos)
        run: npm run lint:css

      - name: Formato
        run: npm run format:check

      # La Definition of Done exige unitarios en verde, y este era el único
      # sitio del CI donde no corrían: `verificar` los incluye en local y el
      # hook de husky también, pero un push directo o un entorno sin hooks se
      # los saltaba. Ahora el verde de la PR significa lo que dice el DoD.
      - name: Tests unitarios
        run: npm test

  base-de-datos:
    name: Migraciones y seguridad de la BBDD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib

      - name: Aplicar migraciones y ejecutar la suite de seguridad
        # Bloqueante a propósito: comprueba que anon no puede leer ninguna tabla
        # privada, que nadie se cuela registrándose, y que un invitado no puede
        # confirmar por otro. Si esto falla, no se mergea.
        run: sudo ./scripts/probar-bbdd.sh

  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium webkit

      - name: Preparar base de datos con migraciones y seed
        # Los E2E corren contra una base REAL, no contra mocks: la landing lee
        # de la base de datos, así que probarla con datos falsos no probaría
        # nada de lo que importa.
        run: echo "DATABASE_URL=$(sudo ./scripts/preparar-bbdd.sh)" >> "$GITHUB_ENV"

      - name: Ejecutar suite E2E
        run: npm run test:e2e

      - name: Guardar informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: playwright-report/
          retention-days: 7

  acceso:
    name: Acceso al panel (Supabase real)
    runs-on: ubuntu-latest
    # Las mismas credenciales para quien prepara y para quien prueba: si
    # vivieran en dos sitios, acabarían discrepando y el fallo sería «no entra»
    # sin más pista.
    env:
      CORREO_CON_ACCESO: con-acceso@ejemplo.test
      CORREO_SIN_ACCESO: sin-acceso@ejemplo.test
      # No es un secreto: son dos usuarios de mentira en una base de datos que
      # se destruye al acabar el trabajo.
      CONTRASENA_PRUEBAS: contrasena-larga-de-pruebas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Levanta Postgres y GoTrue, que es lo que hace falta para probar la
      # puerta del panel. Es lento —descarga imágenes— y por eso va en su
      # propio trabajo: el resto del CI no espera.
      #
      # SIN LOS SERVICIOS QUE NO SE USAN, y son la mitad.
      #
      # Arrancarlos todos costaba fallos recurrentes que no eran nuestros: el
      # buzón de correo se plantaba con «address already in use» por el puerto
      # 54324, y el recolector de logs se quedaba «unhealthy». En los dos casos
      # el trabajo entero se caía por un contenedor que ningún test toca.
      #
      # Se queda lo que hace falta: Postgres, GoTrue —la puerta del panel—,
      # Kong y PostgREST, que es por donde el panel lee y escribe, y el
      # almacenamiento, del que salen las fotos de la landing. Fuera el resto.
      #
      # `logflare` y `vector` van juntos: vector recoge los logs PARA logflare,
      # así que excluir uno solo deja al otro apuntando a un sitio que no
      # existe. Fue exactamente lo que pasó.
      - name: Levantar Supabase
        run: >-
          supabase start
          -x inbucket,imgproxy,studio,logflare,vector,edge-runtime,realtime

      - name: Aplicar migraciones y seed
        run: supabase db reset

      # Crea los usuarios por la API de administración de GoTrue y comprueba,
      # antes de arrancar Playwright, que uno de ellos se puede identificar de
      # verdad. Si esto falla, el problema es la preparación y no la puerta.
      - name: Crear los usuarios de prueba
        run: ./scripts/preparar-acceso-pruebas.sh

      - name: Recoger las claves del Supabase local
        run: supabase status -o env | sed 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/; s/^ANON_KEY=/NEXT_PUBLIC_SUPABASE_ANON_KEY=/; s/^DB_URL=/DATABASE_URL=/; s/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/' | tr -d '"' >> "$GITHUB_ENV"

      - name: Probar el recorrido completo del acceso
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        # LA SUITE ENTERA, NO UNA LISTA DE FICHEROS.
        #
        # Aquí estaban escritos a mano los dos specs que necesitaban sesión, y
        # esa lista se quedó atrás en cuanto apareció el tercero: el test nuevo
        # se saltaba solo —no hay Supabase fuera de este trabajo— y el de aquí
        # ni lo miraba. Verde por los dos lados y sin haberse ejecutado nunca.
        #
        # Este trabajo es el único con Supabase y base de datos de verdad, así
        # que puede correrlo todo. Cuesta un par de minutos más y a cambio
        # ningún spec puede volver a colarse sin ejecutarse.
        run: npx playwright test --project=escritorio

      - name: Guardar informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-acceso
          path: playwright-report/
          retention-days: 7
