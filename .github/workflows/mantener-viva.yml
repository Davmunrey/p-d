# BODA-95 · Que Supabase no pause el proyecto
#
# El plan gratuito pausa los proyectos que pasan una semana sin actividad, y
# entre la reserva de fecha y las primeras confirmaciones puede haber meses de
# silencio. Este flujo le da un toque a la base para que ese contador no llegue
# nunca a la semana.
#
# CADA TRES DÍAS Y NO CADA SEIS. El límite es de siete, así que con seis un
# solo fallo —GitHub retrasa los flujos programados cuando hay carga, y puede
# saltárselos— dejaría pasar la semana. Con tres, tienen que fallar dos
# seguidos para que haya problema.
name: Mantener viva la base

on:
  schedule:
    # Minuto 17 y no en punto: las horas redondas son cuando GitHub tiene la
    # cola llena de flujos de todo el mundo y más retrasa los programados.
    - cron: "17 6 */3 * *"
  # Para poder comprobarlo a mano sin esperar tres días, que es el camino
  # feliz que pide el ticket.
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  toque:
    name: Dar un toque a la base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Leer una fila
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/mantener-viva-la-base.mjs

      # QUE EL FALLO LLEGUE AL BOARD. Cuarenta ejecuciones rojas seguidas en
      # la pestaña Actions no las miró nadie en cinco semanas: un flujo cuyo
      # único aviso es un run rojo produce la misma falsa tranquilidad que uno
      # que se salta en silencio. El board son las incidencias (CLAUDE.md), así
      # que ahí se abre una —o se comenta la que ya esté abierta—.
      - name: Avisar en el board si ha fallado
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "El toque a la base ha fallado"
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          abierta=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITULO\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$abierta" ]; then
            gh issue comment "$abierta" --repo "$GITHUB_REPOSITORY" --body "Ha vuelto a fallar: $ENLACE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITULO" --body "El toque que mantiene despierto el proyecto de Supabase no ha llegado. Si se repite, el proyecto se pausará en una semana de silencio: ver docs/ENTORNO.md.

Registro: $ENLACE"
  fi
